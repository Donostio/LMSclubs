  <script>
    (function () {
      var NEW_SITE = 'https://clubslms.donostio.uk';
      // Keep the page (index, guide, What's New ...), any ?query and #anchor.
      var page = location.pathname.replace(/^\/LMSclubs(\/|$)/i, '/');

      var params = new URLSearchParams(location.search);
      // Label these visits in Google Analytics on the new site, so old-link use can be counted.
      if (!params.has('utm_source')) {
        params.set('utm_source', 'old_github_link');
        params.set('utm_medium', 'redirect');
      }
      location.replace(NEW_SITE + page + '?' + params.toString() + location.hash);
    })();
  </script>
